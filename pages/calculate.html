<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plywood Calculator | S&N Plywood</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(120deg, #f5e6d3 60%, #deb887 100%);
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }
        .calc-container {
            max-width: 420px;
            margin: 60px auto;
            background: rgba(255,255,255,0.85);
            border-radius: 18px;
            box-shadow: 0 8px 32px 0 rgba(139,69,19,0.13);
            padding: 32px 24px 24px 24px;
        }
        .calc-title {
            color: #8b4513;
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 18px;
        }
        .form-label {
            color: #8b4513;
            font-weight: 500;
        }
        .form-control, .form-select {
            border-radius: 8px;
            border: 1px solid #deb887;
            margin-bottom: 16px;
        }
        .btn-calc {
            width: 100%;
            padding: 12px 0;
            background: linear-gradient(90deg, #8b4513 60%, #deb887 100%);
            color: #fff;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 16px #deb88755;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }
        .btn-calc:hover {
            background: linear-gradient(90deg, #deb887 60%, #8b4513 100%);
            transform: scale(1.03);
        }
        .result {
            margin-top: 22px;
            padding: 16px;
            background: #fff8f0;
            border-radius: 10px;
            color: #8b4513;
            font-weight: bold;
            text-align: center;
            border: 1px solid #deb887;
            box-shadow: 0 2px 8px #deb88733;
        }
    </style>
</head>
<body>
    <div class="calc-container">
        <div class="calc-title">Plywood Area Calculator</div>
        <form id="plywoodForm">
            <label for="length" class="form-label">Length (feet):</label>
            <input type="number" class="form-control" id="length" min="1" step="any" required>

            <label for="width" class="form-label">Width (feet):</label>
            <input type="number" class="form-control" id="width" min="1" step="any" required>

            <label for="thickness" class="form-label">Thickness:</label>
            <select class="form-select" id="thickness" required>
                <option value="">Select thickness</option>
                <option value="3">3 mm</option>
                <option value="6">6 mm</option>
                <option value="12">12 mm</option>
                <option value="18">18 mm</option>
            </select>

            <label for="sheets" class="form-label">Number of Sheets:</label>
            <input type="number" class="form-control" id="sheets" min="1" value="1" required>

            <button type="submit" class="btn-calc">Calculate Total Area</button>
        </form>
        <div id="result" class="result" style="display:none;"></div>
    </div>
    <script>
        document.getElementById('plywoodForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const length = parseFloat(document.getElementById('length').value);
            const width = parseFloat(document.getElementById('width').value);
            const sheets = parseInt(document.getElementById('sheets').value, 10);

            if (isNaN(length) || isNaN(width) || isNaN(sheets) || length <= 0 || width <= 0 || sheets <= 0) {
                document.getElementById('result').style.display = 'block';
                document.getElementById('result').textContent = "Please enter valid positive numbers.";
                return;
            }

            const areaPerSheet = length * width;
            const totalArea = areaPerSheet * sheets;

            document.getElementById('result').style.display = 'block';
            document.getElementById('result').innerHTML = `
                <div>Total Area: <strong>${totalArea.toFixed(2)} sq.ft.</strong></div>
                <div>(${sheets} sheet${sheets > 1 ? 's' : ''} of ${length}ft x ${width}ft)</div>
            `;
        });
    </script>
</body>
</html>
